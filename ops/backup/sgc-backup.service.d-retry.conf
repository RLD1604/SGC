# Instalar em /etc/systemd/system/sgc-backup.service.d/retry.conf
# Segunda chance para falhas transitórias (ex.: corrida do PostgreSQL efêmero),
# sem alterar a unidade original. Mesma política do vps-maintenance-backup.
# Com Restart=, a unidade só entra em "failed" (e dispara OnFailure) depois de
# esgotar as 3 tentativas em 2 h.
[Unit]
StartLimitIntervalSec=2h
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=10min
