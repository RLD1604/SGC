# Drop-in idêntico para cada serviço de backup, instalado em
# /etc/systemd/system/<serviço>.service.d/alert.conf
#
# - ExecStartPre: ping /start (mede duração; falha de rede não bloqueia o backup).
# - ExecStartPost: ping de sucesso. O systemd só executa ExecStartPost quando o
#   ExecStart terminou com sucesso, então um backup que falha nunca "confirma".
# - OnFailure: ping /fail quando a unidade entra em estado failed (em serviços com
#   Restart=on-failure, só após esgotar as tentativas).
# O healthchecks.io também alerta sozinho se o ping de sucesso simplesmente não
# chegar no prazo (servidor desligado, timer parado, rede fora).
[Unit]
OnFailure=hc-fail@%n.service

[Service]
ExecStartPre=-/usr/local/sbin/hc-ping %n start
ExecStartPost=-/usr/local/sbin/hc-ping %n
